# /etc/nginx/snippets/codeethos-llm-proxy.conf
# Shared settings for the /llm/v1/* locations.

# Replace the browser's Codeethos token with the llama.cpp key (server-side secret).
include /etc/nginx/secrets/codeethos-llm-auth.conf;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host 100.96.208.90;
proxy_set_header Cookie "";

# Streaming (SSE): send tokens as they arrive.
proxy_buffering    off;
proxy_cache        off;
gzip               off;
proxy_read_timeout 300s;
proxy_send_timeout 60s;

# Don't leak llama.cpp server details back to the browser.
proxy_hide_header Server;

include /etc/nginx/snippets/codeethos-security-headers.conf;
add_header Cache-Control "no-store" always;
add_header X-Accel-Buffering "no" always;
