# /etc/nginx/conf.d/codeethos-zones.conf
# http{}-level settings. Included inside http{} on Debian/Ubuntu.

# --- Real client IP behind Cloudflare -----------------------------------
include /etc/nginx/snippets/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

# --- Rate-limit zones ----------------------------------------------------
# Auth + newsletter: per client IP
limit_req_zone $binary_remote_addr zone=ce_auth:10m       rate=5r/m;
limit_req_zone $binary_remote_addr zone=ce_newsletter:10m rate=3r/m;
# General API: per client IP
limit_req_zone $binary_remote_addr zone=ce_api:10m        rate=10r/s;
# LLM: per signed-in user (their Codeethos token) AND per IP
limit_req_zone $http_authorization zone=ce_llm_user:10m   rate=6r/m;
limit_req_zone $binary_remote_addr zone=ce_llm_ip:10m     rate=10r/m;
# Concurrent streams per user (one generation at a time)
limit_conn_zone $http_authorization zone=ce_llm_conn:10m;

limit_req_status  429;
limit_conn_status 429;

# --- Upstreams -----------------------------------------------------------
# FastAPI backend (Uvicorn)
upstream codeethos_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# llama.cpp server on Tailscale
upstream codeethos_llm {
    server 100.96.208.90:8000;
    keepalive 8;
}
