    <header class="topbar">
      <a href="#/" class="brand" id="brand-link" title="Codeethos Home">

      <div class="top-actions">
        <span class="py-status" id="py-status" title="Language engine status (click to load runtime)"><i></i><em>python idle</em></span>

    <!-- Semantic fallback markup for SEO crawlers and non-JS clients.
         Replaced dynamically by main.js upon client load. -->
    <main id="app">
      <noscript>
        <div style="max-width: 800px; margin: 40px auto; padding: 20px; font-family: monospace;">
          <h1>Codeethos — Learn Programming by Doing</h1>
          <p>Codeethos is an interactive coding platform featuring live in-browser execution, unit-test auto-graded challenges, and an intelligent Socratic AI mentor.</p>
          <h2>Curriculum Tracks:</h2>
          <ul>
            <li><strong>Week 1: Foundations & Interactive CLI</strong> — Variables, control flow, loops, and terminal I/O.</li>
            <li><strong>Week 2: Data Structures & Clean Code</strong> — Lists, dicts, tuples, comprehensions, and DRY functions.</li>
            <li><strong>Week 3: Object-Oriented Programming (OOP)</strong> — Classes, inheritance, polymorphism, Leitner flashcard engine.</li>
            <li><strong>Week 4: File I/O, APIs & Error Handling</strong> — Context managers, requests, robust exception handling.</li>
            <li><strong>Week 5: Introduction to Graphics with Arcade</strong> — Window, Cartesian coordinates, generative math art.</li>
            <li><strong>Week 6: 2D Game Development Capstone</strong> — SpriteLists, physics engines, collisions, and platformer capstone.</li>
            <li><strong>Week 7: Machine Learning Fundamentals</strong> — Scikit-Learn classifiers, feature arrays, model metrics.</li>
            <li><strong>Week 8: Production ML & Pipelines</strong> — Train-test split, preprocessing, cross-validation, serialization.</li>
          </ul>
          <p>Please enable JavaScript to run interactive lessons and in-browser code execution.</p>
        </div>
      </noscript>
    </main>

    <aside class="chat-panel" id="chat-panel" aria-label="AI tutor chat"></aside>
    <div class="modal-root" id="modal-root"></div>
    <div class="toast-root" id="toast-root"></div>
