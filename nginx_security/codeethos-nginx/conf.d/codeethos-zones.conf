# /etc/nginx/conf.d/codeethos-zones.conf
# http{}-level settings. Files in conf.d/ are included inside http{} on Debian/Ubuntu.

# --- Real client IP behind Cloudflare -----------------------------------
# Without this, every request looks like it comes from a Cloudflare edge IP
# and rate limits would hit everyone at once. Generate the include with:
#   { curl -s https://www.cloudflare.com/ips-v4; echo; curl -s https://www.cloudflare.com/ips-v6; } \
#     | sed '/^$/d; s/.*/set_real_ip_from &;/' > /etc/nginx/snippets/cloudflare-ips.conf
include /etc/nginx/snippets/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;
# If the site reaches nginx through cloudflared (tunnel) instead of direct proxying,
# requests arrive from 127.0.0.1 — add:  set_real_ip_from 127.0.0.1;

# --- Rate-limit zones ----------------------------------------------------
# Auth + newsletter: per client IP
limit_req_zone $binary_remote_addr zone=ce_auth:10m       rate=5r/m;
limit_req_zone $binary_remote_addr zone=ce_newsletter:10m rate=3r/m;
# General API: per client IP
limit_req_zone $binary_remote_addr zone=ce_api:10m        rate=10r/s;
# LLM: per signed-in user (their Codeethos token) AND per IP
limit_req_zone $http_authorization zone=ce_llm_user:10m   rate=6r/m;
limit_req_zone $binary_remote_addr zone=ce_llm_ip:10m     rate=10r/m;
# Concurrent streams per user (one generation at a time)
limit_conn_zone $http_authorization zone=ce_llm_conn:10m;

limit_req_status  429;
limit_conn_status 429;

# --- Upstreams -----------------------------------------------------------
# FastAPI backend — set to wherever your API actually listens.
upstream codeethos_api {
    server 127.0.0.1:8001;   # <-- CHANGE to your backend address
    keepalive 16;
}

# llama.cpp router on Rig 1 CT 101.
# Use the LAN IP if nginx runs inside your LAN; use the Tailscale IP
# (100.96.208.90:8000) if nginx runs on a VPS / outside the LAN.
upstream codeethos_llm {
    server 192.168.1.76:8000;
    keepalive 8;
}
