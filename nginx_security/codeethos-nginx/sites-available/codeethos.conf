# /etc/nginx/sites-available/codeethos.conf
# Merge with your existing server block: keep your current listen/ssl/root
# lines if they differ, and add everything else.

server {
    listen 80;
    listen [::]:80;
    server_name codeethos.tech www.codeethos.tech;

    root  /var/www/codeethos/dist;     # <-- CHANGE to your built frontend path
    index index.html;

    server_tokens off;                 # stop advertising "nginx" + version
    client_max_body_size 1m;

    include /etc/nginx/snippets/codeethos-security-headers.conf;

    # ---------------------------------------------------------------------
    # Block dotfiles (.env, .git, .DS_Store …) with a real 404 — keep .well-known
    # ---------------------------------------------------------------------
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # ---------------------------------------------------------------------
    # API — rate-limited sensitive endpoints, then everything else
    # ---------------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=ce_auth burst=5 nodelay;
        proxy_pass http://codeethos_api;
        include /etc/nginx/snippets/codeethos-api-proxy.conf;
    }
    location = /api/auth/register {
        limit_req zone=ce_auth burst=3 nodelay;
        proxy_pass http://codeethos_api;
        include /etc/nginx/snippets/codeethos-api-proxy.conf;
    }
    location = /api/newsletter/subscribe {
        limit_req zone=ce_newsletter burst=2 nodelay;
        proxy_pass http://codeethos_api;
        include /etc/nginx/snippets/codeethos-api-proxy.conf;
    }
    location /api/ {
        limit_req zone=ce_api burst=40 nodelay;
        proxy_pass http://codeethos_api;
        include /etc/nginx/snippets/codeethos-api-proxy.conf;
    }

    # ---------------------------------------------------------------------
    # LLM proxy — signed-in Codeethos users only.
    # The browser sends its Codeethos login token; nginx checks it against
    # /api/auth/me, then swaps in the llama.cpp key server-side.
    # Only two upstream routes are reachable; /props, /slots, /metrics etc. are not.
    # ---------------------------------------------------------------------
    location = /_ce_llm_auth {
        internal;
        proxy_pass http://codeethos_api/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    location = /llm/v1/models {
        limit_except GET { deny all; }
        auth_request /_ce_llm_auth;
        limit_req zone=ce_llm_ip burst=10 nodelay;
        proxy_pass http://codeethos_llm/v1/models;
        include /etc/nginx/snippets/codeethos-llm-proxy.conf;
    }

    location = /llm/v1/chat/completions {
        limit_except POST { deny all; }
        auth_request /_ce_llm_auth;
        limit_req  zone=ce_llm_user burst=3 nodelay;
        limit_req  zone=ce_llm_ip   burst=5 nodelay;
        limit_conn ce_llm_conn 1;
        client_max_body_size 64k;      # caps prompt size (tutor prompt + code + history)
        proxy_pass http://codeethos_llm/v1/chat/completions;
        include /etc/nginx/snippets/codeethos-llm-proxy.conf;
    }

    location /llm/ {
        return 404;
    }

    # ---------------------------------------------------------------------
    # Static assets — hashed filenames, cache forever
    # ---------------------------------------------------------------------
    location /assets/ {
        include /etc/nginx/snippets/codeethos-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # SPA fallback. index.html must not be cached long, or new deploys won't show.
    # ---------------------------------------------------------------------
    location = /index.html {
        include /etc/nginx/snippets/codeethos-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
