# /etc/nginx/snippets/codeethos-security-headers.conf
#
# IMPORTANT nginx gotcha: a location that has ANY add_header of its own stops
# inheriting add_header from the server block. So include this snippet in the
# server block AND in every location that adds its own headers.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CSP — shipped as REPORT-ONLY first. Use the site for a day, watch the browser
# console for "[Report Only]" violations, adjust, then rename the header to
# Content-Security-Policy to enforce it.
#
#  - 'wasm-unsafe-eval' + cdn.jsdelivr.net : Pyodide (wasm + packages from jsDelivr)
#    If the console reports eval violations from pyodide, add 'unsafe-eval' to script-src.
#  - static.cloudflareinsights.com / cloudflareinsights.com : CF Web Analytics beacon
#  - http://localhost:* / 127.0.0.1:* : learners pointing the tutor at their own local LLM
#  - 'unsafe-inline' in style-src : the app uses inline style="" attributes
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net https://cloudflareinsights.com http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
